<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Karston Kuciemba · Software Engineer</title>
    <meta name="description" content="Karston Kuciemba is a software engineer in Austin building products for schools. Explore a 3D desk, or read the plain résumé." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Karston Kuciemba · Software Engineer" />
    <meta property="og:description" content="A 3D desk you can poke at: a real terminal, a cat, and a sky that follows Austin's sun. Type help." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="theme-color" content="#12141F" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&family=Yellowtail&family=Caveat:wght@500&display=swap" />
    <style>
      /* Critical styles so the boot screen looks right before the JavaScript arrives (slow connections). */
      html, body { margin: 0; height: 100%; background: #12141f; color: #f1ece2; overflow: hidden; }
      [hidden] { display: none !important; }
      #boot { position: fixed; inset: 0; z-index: 50; background: #07080d; color: #7fd1c7; font: 14px/1.8 'Space Mono', ui-monospace, Menlo, monospace; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; }
      #boot pre { margin: 0 auto; width: min(560px, 100%); white-space: pre-wrap; font: inherit; }
      #boot .boot-foot a { color: #8a8fa6; }
      .loading-line::after { content: '...'; animation: dots 1s steps(3) infinite; display: inline-block; width: 1.5em; overflow: hidden; vertical-align: bottom; }
      @keyframes dots { from { width: 0; } to { width: 1.5em; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <pre id="bootText"><span class="loading-line">loading</span></pre>
      <div class="boot-foot"><span>click or press any key to skip</span><a href="/resume/">skip to plain résumé →</a></div>
    </div>

    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="brand">
      <h1>Karston<br />Kuciemba</h1>
      <p class="role" id="pitch"></p>
      <p class="hint"><span>Click anything on the desk</span><span class="kb">· or type <kbd>help</kbd></span><a class="hint-resume" href="/resume/">Plain résumé →</a></p>
    </div>

    <div class="tools">
      <button class="pill" id="secretsBtn" type="button" aria-label="Secrets found"><span class="star">★</span><span id="secretsCount">0/10</span></button>
      <a class="pill resume-pill" href="/resume/">Plain résumé</a>
      <button class="pill" id="soundBtn" type="button" aria-pressed="false" aria-label="Rain sound"><span class="dot"></span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M16 14v6" /><path d="M8 14v6" /><path d="M12 16v6" /></svg><span class="t">Rain sound</span></button>
      <button class="pill" id="lampBtn" type="button" aria-pressed="true" aria-label="Lamp"><span class="dot"></span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-3 3 2 7 8-8-7-2Z" /><path d="m14 5-3 3-3-3 3-3 3 3Z" /><path d="M9.5 6.5 4 12l3 6" /><path d="M3 22v-2c0-1.1.9-2 2-2h4a2 2 0 0 1 2 2v2H3Z" /></svg><span class="t">Lamp</span></button>
    </div>

    <nav class="dock" aria-label="Sections" id="dock"></nav>
    <aside class="panel" id="panel" aria-live="polite" hidden></aside>
    <div class="label" id="label" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <button class="pill stand" id="standBtn" type="button">Stand up <kbd>esc</kbd></button>
    <div class="fallback" id="fallback" hidden></div>

    <!--noscript-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
